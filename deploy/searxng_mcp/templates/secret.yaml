{{- $token := required "auth.token must be set (bearer token clients use as 'Authorization: Bearer <token>')" .Values.auth.token -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "app.secretName" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
type: Opaque
stringData:
  MCP_HTTP_AUTH_TOKEN: {{ $token | quote }}
