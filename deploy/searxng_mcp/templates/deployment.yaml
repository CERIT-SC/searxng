apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "app.fullname" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "app.selectorLabels" . | nindent 8 }}
      annotations:
        # Roll when the auth token changes.
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "app.image" . }}
          imagePullPolicy: Always
          securityContext:
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
          env:
            - name: SEARXNG_URL
              value: {{ required "searxng.url must be set" .Values.searxng.url | quote }}
            - name: MCP_HTTP_PORT
              value: {{ .Values.containerPort | quote }}
            - name: MCP_HTTP_HOST
              value: "0.0.0.0"
            # - name: MCP_HTTP_HARDEN
            #   value: "true"
            - name: MCP_HTTP_TRUST_PROXY
              value: "true"
            # - name: MCP_HTTP_ALLOWED_ORIGINS
            #   value: {{ concat (list (printf "https://%s" (include "app.host" .))) .Values.extraAllowedOrigins | uniq | join "," | quote }}
            # - name: MCP_HTTP_ALLOWED_HOSTS
            #   value: {{ concat (list (include "app.host" .)) .Values.extraAllowedHosts | uniq | join "," | quote }}
            - name: MCP_HTTP_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "app.secretName" . }}
                  key: MCP_HTTP_AUTH_TOKEN
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
