# =============================================================================
# SearXNG - Lean configuration tuned as an AI-agent search backend
# =============================================================================
# Goal: good, clean results with low latency and high reliability.
#   - General category: Bing + Qwant + Startpage (reliable, no rate limits)
#   - DuckDuckGo removed (persistent CAPTCHA challenges)
#   - Brave removed (persistent "too many requests" rate limiting)
#   - Mojeek removed (persistent "access denied" blocking)
#   - Crypto results filtered via hostnames plugin blocklist
#   - Knowledge shown as infoboxes, not result spam
#   - Specialist engines are category-gated (don't fire on normal queries)
#   - JSON output enabled for the agent
#
# Drop at: /etc/searxng/settings.yml
# =============================================================================

use_default_settings:
  engines:
    keep_only:
      - bing
      - bing news
      - startpage
      - wikipedia
      - wikidata
      - github
      - stackoverflow      # served by the "stackexchange" engine in defaults
      - arxiv
      - pubmed
      - europepmc
      - semantic scholar
      - openalex
      - crossref
      - arxiv
      - unpaywall
      - annas archive
      - duckduckgo
      - startpage
      - yahoo
      - seznam

general:
  debug: false
  instance_name: "SearXNG"
  enable_metrics: true

search:
  safe_search: 1
  autocomplete: ""
  favicon_resolver: ""
  default_lang: "auto"
  ban_time_on_fail: 5
  max_ban_time_on_fail: 120
  formats:
    - json
    - html

server:
  port: 8080
  bind_address: "0.0.0.0"
  base_url: {{ include "searxng.baseUrl" . | quote }}
  public_instance: false
  secret_key: {{ required "searxng.secretKey must be set" .Values.searxng.secretKey | quote }}
  image_proxy: false          # agent doesn't render images; save the bandwidth
  http_protocol_version: "1.1"
  method: "GET"
  default_http_headers:
    X-Content-Type-Options: nosniff
    X-Download-Options: noopen
    X-Robots-Tag: noindex, nofollow
    Referrer-Policy: no-referrer

ui:
  default_theme: simple
  default_locale: ""

outgoing:
  # Tight, predictable timeouts so one slow engine can't stall a query.
  request_timeout: 4.0
  max_request_timeout: 8.0
  pool_connections: 100
  pool_maxsize: 20
  enable_http2: true

# Keep only the lightweight, useful plugins. Unit/calculator/time answers
# are cheap and occasionally handy for an agent; the rest add nothing here.
plugins:
  searx.plugins.calculator.SXNGPlugin:
    active: true
  searx.plugins.unit_converter.SXNGPlugin:
    active: true
  searx.plugins.time_zone.SXNGPlugin:
    active: true
  searx.plugins.tracker_url_remover.SXNGPlugin:
    active: true
  searx.plugins.oa_doi_rewrite.SXNGPlugin:
    active: true
  searx.plugins.self_info.SXNGPlugin:
    active: false
  searx.plugins.hash_plugin.SXNGPlugin:
    active: false
  searx.plugins.infinite_scroll.SXNGPlugin:
    active: false
  searx.plugins.ahmia_filter.SXNGPlugin:
    active: false
  searx.plugins.hostnames.SXNGPlugin:
    active: true

