# ---------------------------------------------------------------------------
# Per-engine overrides.
# keep_only loads each engine with its DEFAULT config, so engines that ship
# disabled must be re-enabled here. The rest are on by default.
# ---------------------------------------------------------------------------
engines:
  - name: bing
    disabled: false

  - name: startpage
    disabled: false

  - name: annas archive
    disabled: false

  - name: wikipedia
    display_type: ["infobox"]

  - name: wikidata
    weight: 2
    display_type: ["infobox"]

  - name: yahoo
    disabled: false

  - name: duckduckgo
    timeout: 6.0
    disabled: false
  
  - name: seznam
    disabled: false
  
  - name: startpage
    inactive: false


