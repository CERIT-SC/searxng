---
replicaCount: 1

image:
  registry: cerit.io
  repository: robindurnik/searxng
  tag: dev
  digest: ""
  pullPolicy: Always

nameOverride: ""
fullnameOverride: ""

host: ""

ingress:
  enabled: true

networkPolicy:
  # Restrict ingress to the ingress gateway namespace. Set false for
  # in-cluster-only access without a NetworkPolicy.
  enabled: false
  # Additional namespaces allowed to reach the HTTP port (besides kube-system,
  # where the ingress gateway runs). Matches the automatic
  # kubernetes.io/metadata.name namespace label.
  allowedNamespaces: []
  #  - litellm


searxng:
  baseUrl: "/"
  secretKey: "secret"

resources:
  requests:
    cpu: "100m"
    memory: "256Mi"
  limits:
    cpu: "1"
    memory: "512Mi"
