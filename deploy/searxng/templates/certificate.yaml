---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "searxng.fullname" . }}-tls
  labels:
    {{- include "searxng.labels" . | nindent 4 }}
spec:
  secretName: {{ include "searxng.fullname" . }}-tls
  issuerRef:
    name: letsencrypt-gateway
    kind: ClusterIssuer
  dnsNames:
    - {{ include "searxng.host" . }}
