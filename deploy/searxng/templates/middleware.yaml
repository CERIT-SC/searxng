---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "searxng.fullname" . }}-ipallowlist
  labels:
    {{- include "searxng.labels" . | nindent 4 }}
spec:
  ipAllowList:
    sourceRange:
{{- range required "allowedIPs must be set" .Values.allowedIPs }}
      - {{ . | quote }}
{{- end }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "searxng.fullname" . }}-redirect-https
  labels:
    {{- include "searxng.labels" . | nindent 4 }}
spec:
  redirectScheme:
    scheme: https
    permanent: true
